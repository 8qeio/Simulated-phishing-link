
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>피싱 보안 안내 페이지</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Malgun Gothic", sans-serif;
      background: #f4f6f9;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 560px;
      padding: 36px 28px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .icon {
      font-size: 52px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 24px;
      color: #dc2626;
      font-size: 29px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .notice {
      text-align: left;
      font-size: 16px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .safe {
      margin: 20px 0;
      padding: 14px;
      border-radius: 10px;
      background: #ecfdf3;
      color: #15803d;
      font-weight: bold;
      text-align: center;
    }

    .warning {
      margin-top: 20px;
      color: #555;
    }

    .survey-button {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 16px 20px;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .survey-button:hover {
      background: #b91c1c;
    }

    .survey-button:focus-visible {
      outline: 3px solid #991b1b;
      outline-offset: 4px;
    }

    .footer {
      margin-top: 22px;
      color: #888;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 400px) {
      .container {
        padding: 28px 20px;
      }

      h1 {
        font-size: 25px;
      }

      .notice {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>⚠️피싱에 속으셨습니다!</h1>
      <p>
        이 페이지는 '피싱 공격 판별 정확도'를 주제로 연구를 진행하면서 피싱 위험성을 알리고 보안 의식을 높이기 위해 제작한 <strong>모의 해킹 링크</strong>입니다.<br><br>
        <strong>실제 악성코드는 설치되지 않았으니 안심하셔도 괜찮습니다!</strong> 출처가 불분명한 링크는 함부로 클릭하지 않는 습관이 중요합니다.<br><br>
        아래 버튼을 눌러 모의 해킹 링크를 클릭하게 된 이유를 설문으로 알려주시면 큰 도움이 됩니다!
      </p>
    <a
      class="survey-button"
      href="https://forms.gle/6mNHJHuDg2MY6Bws5"
      target="_blank"
      rel="noopener noreferrer"
    >
      설문조사 참여하기
    </a>

    <div class="footer">
      본 페이지는 피싱 공격 판별 정확도 연구 및
      보안 의식 향상을 위한 교육 목적으로 제작되었습니다.
    </div>
  </main>
</body>
</html>
